info:
  name: "2. Register the signer for EMBED"
  type: http
  seq: 2
  tags:
    - Scenarios
    - Embed in Your Site

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/createlist?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "signers": [
          {
            "email": "signer@example.com",
            "act": "1",
            "foreign": "0",
            "certificadoicpbr": "0",
            "assinatura_presencial": "0",
            "embed_methodauth": "email"
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Step 2 of 3. Uses `uuid_document` from step 1. `embed_methodauth`
  can also be `sms`, `whats`, or `password` — see
  `guides/embed.md`. The `email` here must match the `signer_email`
  you pass to the iframe snippet in step 3 exactly.
