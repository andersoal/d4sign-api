info:
  name: "3. Upload document 2 of 2"
  type: http
  seq: 3
  tags:
    - Scenarios
    - Batch Group Signing

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_safe/upload?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_safe
      value: "{{uuid_safe}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: [./example.pdf]

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200 && body && body.uuid) {
          bru.setVar('uuid_document_2', body.uuid);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Step 3 of 8. Second document of the N=2 demo loop, saved as
  `uuid_document_2`.
