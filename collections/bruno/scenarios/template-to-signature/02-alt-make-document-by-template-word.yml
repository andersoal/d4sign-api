info:
  name: "2-alt. Generate the document (Word template)"
  type: http
  seq: 99
  tags:
    - Scenarios
    - Template to Signature

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_safe/makedocumentbytemplateword?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_safe
      value: "{{uuid_safe}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name_document": "Contrato — João",
        "templates": {
          "{{template_id}}": {
            "NOME_CLIENTE": "João",
            "CPF": "222.222.222-22"
          }
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200 && body && body.uuid) {
          bru.setVar('uuid_document', body.uuid);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Alternative to step 2 — same shape, different endpoint, for Word
  templates instead of HTML. `seq: 99` keeps it out of a normal
  recursive run of this folder; run it by hand instead of step 2, not
  alongside it. Supports multiple "preenchedores" (form-fillers)
  filling different sections — see the full multi-filler body shape at
  `/d4sign-api/reference/operations/documents_template_word_create/`.
