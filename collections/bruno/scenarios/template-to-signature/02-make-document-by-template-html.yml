info:
  name: "2. Generate the document (HTML template)"
  type: http
  seq: 2
  tags:
    - Scenarios
    - Template to Signature

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_safe/makedocumentbytemplate?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_safe
      value: "{{uuid_safe}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name_document": "Contrato — João",
        "templates": {
          "{{template_id}}": {
            "NOME_CLIENTE": "João",
            "CPF": "222.222.222-22"
          }
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200 && body && body.uuid) {
          bru.setVar('uuid_document', body.uuid);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Step 2 of 4. Uses `uuid_safe` and `template_id` from step 1, and
  saves the new document's UUID as `uuid_document` for steps 3-4.

  The SDK's first parameter is named `$documentKey` but is actually
  the safe's UUID — there's no document yet, it's about to be
  created. `NOME_CLIENTE`/`CPF` must match your real template's
  registered field names exactly (case-sensitive) — these are just
  the recipe's example fields.

  Mutually exclusive with `02-alt-make-document-by-template-word.yml`
  — run one or the other, not both, since each overwrites
  `uuid_document`.
