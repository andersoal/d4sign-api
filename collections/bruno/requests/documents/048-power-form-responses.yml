info:
  name: Power Form Responses
  type: http
  seq: 48
  tags:
    - Documents

http:
  method: GET
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/powerformresponses?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lista as respostas preenchidas em um Power Form (documento gerado a partir de um link público preenchível).
