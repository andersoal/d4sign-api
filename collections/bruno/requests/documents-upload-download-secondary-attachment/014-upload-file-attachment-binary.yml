info:
  name: Upload File Attachment Binary
  type: http
  seq: 14
  tags:
    - Documents Upload/Download/Secondary / Attachment
    - Documents
    - Documents Upload

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/uploadslavebinary?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {
        "base64_binary_file": "JVhsdCAdwesAD2dsadfASDQW...",
        "mime_type": "application/pdf",
        "name": "Meu contrato de venda"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Esse objeto realizará o UPLOAD do seu documento para os servidores da D4Sign.
  
  Após o UPLOAD, o documento será criptografado em nossos cofres e carimbado com um número de série.
  
  Após o processamento um preview será gerado. O processamento será realizado em background, ou seja, a requisição não ficará bloqueada.
