info:
  name: Document signatories list
  type: http
  seq: 22
  tags:
    - Signatories
    - Documents

http:
  method: GET
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/list?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lista todos os signatários de um documento, com status e dados de assinatura (IP, geolocalização, data).
