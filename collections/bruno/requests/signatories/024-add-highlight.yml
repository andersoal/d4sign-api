info:
  name: Add Highlight
  type: http
  seq: 24
  tags:
    - Signatories
    - Documents

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/addhighlight?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {
        "key_signer": "NwYj=",
        "email": "seusignatario@email.com",
        "text": "Cl\u00e1usula que ser\u00e1 destacada"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Esse objeto cadastrará as informações (texto) para serem destacadas para o signatário
