info:
  name: Remove Trust ID
  type: http
  seq: 36
  tags:
    - Signatories

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/removetrustid?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Remove a verificação Trust ID previamente adicionada a um ou mais signatários (`email`).
