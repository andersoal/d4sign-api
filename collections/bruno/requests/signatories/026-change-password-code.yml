info:
  name: Change Password Code
  type: http
  seq: 26
  tags:
    - Signatories
    - Documents

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/changepasswordcode?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {
        "email": "email@dominio.com",
        "password-code": "C\u00f3digo para acessar o documento",
        "key-signer": "NyWx="
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Atualiza o código de acesso do signatário (deixe `password-code` em branco para remover o código atual).
