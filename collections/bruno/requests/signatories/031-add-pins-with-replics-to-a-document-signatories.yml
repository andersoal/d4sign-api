info:
  name: Add Pins with Replics to a Document Signatories
  type: http
  seq: 31
  tags:
    - Signatories
    - Documents

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/addpinswithreplics?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {
        "pins": [
          {
            "document": "uuid-do-documento",
            "email": "emaila@dominio.com.br",
            "page_width": 794,
            "page_height": 1123,
            "page": 1,
            "position_x": 397,
            "position_y": 560,
            "type": 0
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Replica uma posição de assinatura em TODAS as páginas do documento principal e, opcionalmente, de anexos (`document_slaves`).
  
  | Parâmetro | Descrição |
  | --- | --- |
  | `email` (obrigatório) | Signatário já cadastrado no documento. |
  | `page_width`/`page_height` (obrigatório) | Dimensões da página, em px. |
  | `position_x`/`position_y` (obrigatório) | Posição, em mm. |
  | `type` (opcional) | `0` = assinatura, `1` = rubrica, `2` = selo. |
