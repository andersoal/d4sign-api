info:
  name: Remove Pins of a Document
  type: http
  seq: 33
  tags:
    - Signatories

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documents/:uuid_document/removepins?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Remove uma assinatura/rubrica posicionada (pin) do documento, por `email`, `page`, `position_x`, `position_y`.
