info:
  name: Remove All Tags from Document
  type: http
  seq: 54
  tags:
    - Tags
    - Documents

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tags/:uuid_document/erase?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_document
      value: "{{uuid_document}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Remove TODAS as TAGs do documento.
