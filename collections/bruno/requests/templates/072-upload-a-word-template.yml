info:
  name: Upload a Word Template
  type: http
  seq: 72
  tags:
  - Templates

http:
  method: POST
  url: "{{baseUrl}}/api/v1/templates/upload?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
  - name: tokenAPI
    value: "{{tokenAPI}}"
    type: query
  - name: cryptKey
    value: "{{cryptKey}}"
    type: query
  body:
    type: multipart-form
    data:
    - name: file
      type: file
      value: [./example.pdf]
    - name: show_desk
      value: ''
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cria um novo template a partir de um arquivo .doc/.docx. Diferente de `makedocumentbytemplateword`, que GERA um documento a partir de um template ja existente - este endpoint CRIA o template em si.

  > Encontrado comparando a navegacao da doc oficial (v2.0) contra o export original deste spec - nao estava presente. Veja docapi.d4sign.com.br/v2.0/reference/template-word-upload.
