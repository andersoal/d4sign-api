info:
  name: Unblock User
  type: http
  seq: 66
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/unblock?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {
        "email_user": "email@usuario.com.br"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Desbloqueia um usuário (`email_user`) do domínio validado.
