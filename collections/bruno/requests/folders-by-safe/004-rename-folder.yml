info:
  name: Rename Folder
  type: http
  seq: 4
  tags:
    - Folders by Safe
    - Folders

http:
  method: POST
  url: "{{baseUrl}}/api/v1/folders/:uuid_safe/rename?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}"
  params:
    - name: uuid_safe
      value: "{{uuid_safe}}"
      type: path
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
  body:
    type: json
    data: |-
      {
        "folder_name": "Nome da pasta",
        "uuid_folder": ""
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Renomeia uma pasta ou subpasta dentro do cofre informado.
  
  | Parâmetro | Descrição |
  | --- | --- |
  | `folder_name` (obrigatório) | Novo nome da pasta ou subpasta. |
  | `uuid_folder` (obrigatório) | UUID da pasta ou subpasta a renomear. |
