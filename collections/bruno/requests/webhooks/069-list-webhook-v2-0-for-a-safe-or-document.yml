info:
  name: List Webhook v2.0 for a Safe or Document
  type: http
  seq: 69
  tags:
    - Webhooks

http:
  method: GET
  url: "{{baseUrl}}/api/v1/webhooks/v2/?tokenAPI={{tokenAPI}}&cryptKey={{cryptKey}}&type=documento&uuid={{uuid}}"
  params:
    - name: tokenAPI
      value: "{{tokenAPI}}"
      type: query
    - name: cryptKey
      value: "{{cryptKey}}"
      type: query
    - name: type
      value: documento
      type: query
    - name: uuid
      value: "{{uuid}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lista o(s) webhook(s) cadastrado(s) para um cofre ou documento (API v2.0 - substitui/complementa a v1, que so cobria documentos).
  
  > Descoberto via busca na documentacao oficial em docapi.d4sign.com.br/reference/listar-webhook-de-um-cofre-ou-documento-versao-20 - nao estava no export original deste spec.
