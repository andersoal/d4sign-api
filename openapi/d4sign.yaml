      description: "Esse objeto realizará o cadastro dos signatários do documento, ou seja, quais pessoas precisam assinar esse documento.\n\n<AccordionGroup>\n  <Accordion title=\"Case para Incluir Signatários\" defaultOpen>\n   <Columns>\n  \n      <Column>\n      Requisição\n    ```json\n{\n    \"signers\" : [\n        {\n            \"email\": \"email@dominio.com\",\n            \"act\": \"1\",\n            \"foreign\": \"1\",\n            \"certificadoicpbr\": \"0\",\n            \"assinatura_presencial\": \"0\",\n            \"docauth\": \"0\",\n            \"docauthandselfie\": \"0\",\n       \t    \"embed_methodauth\": \"email\",\n      \t    \"embed_smsnumber\": \"\",\n      \t    \"upload_allow\": \"0\",\n      \t    \"upload_obs\": \"Contrato Social e Conta de Luz\",\n      \t    \"whatsapp_number\": \"+5511981876540\" (opcional),\n      \t    \"uuid_grupo\": \"UUID DO GRUPO\" (opcional),\n      \t    \"certificadoicpbr_tipo\": \"2\" (opcional),\n      \t    \"certificadoicpbr_cpf\": \"CPF\" (opcional),\n      \t    \"certificadoicpbr_cnpj\": \"CNPJ\" (opcional),\n      \t    \"password_code\": \"Código de acesso\" (opcional),\n      \t    \"auth_pix\": \"0\" (opcional),\n      \t    \"auth_pix_nome\": \"Nome do signatário\" (opcional),\n      \t    \"auth_pix_cpf\": \"21917876280\" (opcional),\n      \t    \"videoselfie\": \"0\" (opcional),\n      \t    \"d4sign_score\": \"0\" (opcional),\n      \t    \"d4sign_score_nome\": \"Nome do signatário\" (opcional),\n      \t    \"d4sign_score_cpf\": \"21917876280\" (opcional),\n            \"d4sign_score_similarity\": \"90\" (min 70 - max 90)(opcional),\n            \"skipemail\": \"1\"(opcional)\n        },\n        {...}\n        ]\n}\n```\n  </Column>\n  <Column>\n      Resposta\n    ```json\n      {\n    \"key_signer\": \"NwYu=\",\n    \"email\": \"email@user.com.br\",\n    \"act\": \"1\",\n    \"foreign\": \"0\",\n    \"certificadoicpbr\": \"0\",\n    \"assinatura_presencial\": \"0\",\n    \"assinatura_presencial_link\": \"LINK PARA ASSINATURA PRESENCIAL\" - O link só será exibido depois que o documento for enviado para assinatura,\n    \"doc_auth\": \"0\",\n    \"embed_methodauth\": \"email\",\n    \"embed_smsnumber\": \"\",\n    \"upload_allow\": \"0\",\n    \"upload_obs\": \"Contrato Social e Conta de Luz\",\n    \"docauthandselfie\": \"0\",\n    \"skipemail\": \"0\",\n    \"whatsapp\": \"\",\n    \"password_code\": \"\",\n    \"status\": \"created\"\n}\n    ```\n  </Column>\n</Columns>\n\n| Parâmetro | Descrição |\n| --- | --- |\n| email (obrigatório) | E-mail do signatário |\n| act (obrigatório) | Ação da assinatura. Valores permitidos:   1 = Assinar   2 = Aprovar   3 = Reconhecer   4 = Assinar como parte   5 = Assinar como testemunha   6 = Assinar como interveniente   7 = Acusar recebimento   8 = Assinar como Emissor, Endossante e Avalista   9 = Assinar como Emissor, Endossante, Avalista, Fiador   10 = Assinar como fiador   11 = Assinar como parte e fiador   12 = Assinar como responsável solidário   13 = Assinar como parte e responsável solidário |\n| foreign (obrigatório) | Indica se o signatário é estrangeiro. 0 = Possui CPF; 1 = Não possui CPF |\n| foreign\\_lang | Idioma do estrangeiro: en = Inglês, es = Espanhol, pt = Português |\n| certificadoicpbr (obrigatório) | 0 = Assinatura padrão D4Sign   1 = Assinatura com Certificado ICP-Brasil |\n| assinatura\\_presencial (obrigatório) | 1 = Assinatura presencial   0 = Não presencial |\n| docauth (opcional) | 1 = Exige documento com foto   0 = Não exige |\n| docauthandselfie (opcional) | 1 = Documento + selfie   0 = Não exige selfie |\n| embed\\_methodauth (opcional) | Método de autenticação: email, password, sms, whats |\n| embed\\_smsnumber (opcional) | Número do SMS ou WhatsApp no padrão (ex.: +5511953020202) |\n| upload\\_allow (opcional) | Indica se o signatário pode enviar outros documentos |\n| upload\\_obs (opcional) | Quais documentos o signatário deve enviar (se upload\\_allow = 1) |\n| after\\_position (opcional) | Define a posição após a qual o signatário será inserido na ordem |\n| skipemail (opcional)
        | 1 = Não enviar e-mails ao signatário |\n| whatsapp\\_number (opcional) | Número de WhatsApp para assinatura |\n| uuid\\_grupo (opcional) | UUID do grupo de assinatura |\n| certificadoicpbr\\_tipo (opcional) | 1 = Qualquer certificado   2 = e-CPF   3 = e-CNPJ |\n| certificadoicpbr\\_cpf (opcional) | CPF do signatário. Em branco = qualquer e-CPF |\n| certificadoicpbr\\_cnpj (opcional) | CNPJ do signatário. Em branco = qualquer e-CNPJ |\n| password\\_code (opcional) | Código de acesso do signatário. Em branco remove código anterior |\n| auth\\_pix (opcional) | 1 = Autenticação via PIX |\n| auth\\_pix\\_nome | Nome obrigatório se auth\\_pix = 1 |\n| auth\\_pix\\_cpf | CPF obrigatório se auth\\_pix = 1 |\n| sms-number (obrigatório) | NOVO número de SMS do signatário |\n| key-signer | Chave do signatário |\n| videoselfie | 1 = Exige vídeo selfie |\n| d4sign\\_score (opcional) | Ativa D4Sign Score. Requer CNH + docauthandselfie = 1 ou videoselfie = 1 |\n| d4sign\\_score\\_nome | Nome obrigatório se d4sign\\_score = 1 |\n| d4sign\\_score\\_cpf | CPF obrigatório se d4sign\\_score = 1 |\n| d4sign\\_score\\_similarity | Nível de similaridade exigida (min: 70, max: 90) |\n  </Accordion>\n  <Accordion title=\"Case para Inserir Grupos de Signatários a um Documento\">\n\n| Parâmetro | Descrição |\n| --- | --- |\n| email (obrigatório) | E-mail do signatário |\n| act (obrigatório) | Ação da assinatura. Valores permitidos:   1 = Assinar   2 = Aprovar   3 = Reconhecer   4 = Assinar como parte   5 = Assinar como testemunha   6 = Assinar como interveniente   7 = Acusar recebimento   8 = Assinar como Emissor, Endossante e Avalista   9 = Assinar como Emissor, Endossante, Avalista, Fiador   10 = Assinar como fiador   11 = Assinar como parte e fiador   12 = Assinar como responsável solidário   13 = Assinar como parte e responsável solidário |\n| foreign (obrigatório) | Indica se o signatário é estrangeiro. 0 = Possui CPF; 1 = Não possui CPF |\n| foreign\\_lang | Idioma do estrangeiro: en = Inglês, es = Espanhol, pt = Português |\n| certificadoicpbr (obrigatório) | 0 = Assinatura padrão D4Sign   1 = Assinatura com Certificado ICP-Brasil |\n| assinatura\\_presencial (obrigatório) | 1 = Assinatura presencial   0 = Não presencial |\n| docauth (opcional) | 1 = Exige documento com foto   0 = Não exige |\n| docauthandselfie (opcional) | 1 = Documento + selfie   0 = Não exige selfie |\n| embed\\_methodauth (opcional) | Método de autenticação: email, password, sms, whats |\n| embed\\_smsnumber (opcional) | Número do SMS ou WhatsApp no padrão (ex.: +5511953020202) |\n| upload\\_allow (opcional) | Indica se o signatário pode enviar outros documentos |\n| upload\\_obs (opcional) | Quais documentos o signatário deve enviar (se upload\\_allow = 1) |\n| after\\_position (opcional) | Define a posição após a qual o signatário será inserido na ordem |\n| skipemail (opcional) | 1 = Não enviar e-mails ao signatário |\n| whatsapp\\_number (opcional) | Número de WhatsApp para assinatura |\n| uuid\\_grupo (opcional) | UUID do grupo de assinatura |\n| certificadoicpbr\\_tipo (opcional) | 1 = Qualquer certificado   2 = e-CPF   3 = e-CNPJ |\n| certificadoicpbr\\_cpf (opcional) | CPF do signatário. Em branco = qualquer e-CPF |\n| certificadoicpbr\\_cnpj (opcional) | CNPJ do signatário. Em branco = qualquer e-CNPJ |\n| password\\_code (opcional) | Código de acesso do signatário. Em branco remove código anterior |\n| auth\\_pix (opcional) | 1 = Autenticação via PIX |\n| auth\\_pix\\_nome | Nome obrigatório se auth\\_pix = 1 |\n| auth\\_pix\\_cpf | CPF obrigatório se auth\\_pix = 1 |\n| sms-number (obrigatório) | NOVO número de SMS do signatário |\n| key-signer | Chave do signatário |\n| videoselfie | 1 = Exige vídeo selfie |\n| d4sign\\_score (opcional) | Ativa D4Sign Score. Requer CNH + docauthandselfie = 1 ou videoselfie = 1 |\n| d4sign\\_score\\_nome | Nome obrigatório se d4sign\\_score = 1 |\n| d4sign\\_score\\_cpf | CPF obrigatório se d4sign\\_score = 1 |\n| d4sign\\_score\\_similarity | Nível de similaridade exigida (min: 70, max: 90) |\n\nConforme imagem acima
        (onde act significa o tipo de ação que este grupo terá no processo de assinatura, como assinar, aprovar, etc; e uuid\\_grupo é o uuid do grupo presente no mesmo cofre que este documento, que pode ser consultado a partir de outro endpoint já existente e funcional na documentação:\n      \n      \n  </Accordion>\n  <Accordion title=\"Case Adcionar Trust ID (Verificação Extra)\">\n    https://docapi.d4sign.com.br/docs/endpoints-2#adicionar-trust-id-verifica%C3%A7%C3%A3o-extra\n  </Accordion>\n</AccordionGroup>\n\n\n"
      operationId: documentsSignatoriesCreate
      tags:
      - Signatories
      parameters:
