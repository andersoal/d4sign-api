  /api/v1/documents/{id_status}/status:
    get:
      summary: List documents by Status
      deprecated: false
      description: |
        Lista todos os documentos que estiverem na fase informada.

        | ID | Fase |
        | --- | --- |
        | 1 | Processando |
        | 2 | Aguardando Signatários |
        | 3 | Aguardando Assinaturas |
        | 4 | Finalizado |
        | 5 | Arquivado |
        | 6 | Cancelado |
        | 7 | Editando |

        > Paginado em blocos de 500 documentos — use `pg` na URL.
      operationId: documentsListByStatus
      tags:
      - Documents
      parameters:
      - name: id_status
        in: path
        description: ''
        required: true
        schema:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
      - name: pg
        in: query
        description: Page - Default 1 / Starts 1
        required: false
        example: '2'
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
          description: ''
        '401':
          $ref: '#/components/responses/Not_Logged'
          description: ''
      security:
      - tokenAPI: []
        cryptKey: []
