                    - nome_completo
                    - endereco
                    - celular
                    - razao_social_da_contratante
                    - rua_contratante
                    - numero_contratante
                    - cidade_contratante
                    - estado_contratante
                    - cnpj_contratante
                    - estado_de_custos_referenciais
                    - prazo_de_pagamento
                    - local_e_data_da_assinatura
                '4':
                  id: MjAyOTM5
                  name: Make.docx
                  type: word
                  variables: []
                '5':
                  id: MjAyOTQw
                  name: Modelo template para contrato com 1 preenchedor.docx
                  type: word
                  variables:
                    preenchedor:
                    - informacao_que_deve_ser_preenchida
                    - nome_completo
                    - endereco
                    - celular
                    tokens_gerais:
                    - nome_completo
                    - endereco
                    - celular
                    - razao_social_da_contratante
                    - rua_contratante
                    - numero_contratante
                    - cidade_contratante
                    - estado_contratante
                    - cnpj_contratante
                    - estado_de_custos_referenciais
                    - prazo_de_pagamento
                    - local_e_data_da_assinatura
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/makedocumentbytemplate:
    post:
      summary: Make document by Template HTML
      deprecated: false
      description: >+
        Esse objeto irá gerar um documento em seu cofre a partir de um template.



        :::highlight orange 📌

        Obs.: Para criar o documento em um cofre, é importante revisar a opção
        **Compartilhar** nas **Opções do template** em um template HTML, será
        preciso ter as permissões de acesso "Administrador" ou "Padrão".

        :::


        | Key | Description |

        | --- | --- |

        | name_document | (Opcional) Define o nome do documento. Se não for
        preenchido, o documento terá o nome "Documento" |

        | uuid_folder | (opcional) Para que o documento fique armazenado dentro
        da pasta, informe o UUID dela. Se não for preenchido, o documento será
        salvo no cofre informado na requisição. |

        | templates | (obrigatório) ID do template na CHAVE `id_template` e as
        variáveis em conjuntos de CHAVE e VALOR. |

      operationId: documentsTemplatePostHtml
      tags:
      - Documents Templates
      - Templates
      - Documents
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name_document:
                  type: string
                  description: >-
                    (opcional) Define o nome do documento. Se não for
                    preenchido, o documento terá o nome "Documento"
                uuid_folder:
                  type: string
                  description: >-
                    (opcional) Para que o documento fique armazenado dentro da
                    pasta, informe o UUID dela.
                templates:
                  type: object
                  properties:
                    '{{template_id}}':
                      type: object
                      properties:
                        '{{variable_nome}}':
                          type: string
                        '{{variable_endereco}}':
                          type: string
                        '{{variable_anything}}':
                          type: string
                      required:
                      - '{{variable_nome}}'
                      - '{{variable_endereco}}'
                      - '{{variable_anything}}'
                      description: >-
                        Array contendo o ID do template na CHAVE e as variáveis
                        no VALUE.
                  required:
                  - '{{template_id}}'
                  description: >-
                    Lembrando que você deverá informar pelo menos um template.
                    As variáveis dos campos personalizados (ex.: arrastando,
                    bloco, NOME_CONTRATANTE, etc.) precisam ser informadas
                    exatamente iguais ao cadastro. Ex.: 'NOME_CONTRATANTE' =>
                    'fulano' irá substituir o campo personalizado
                    NOME_CONTRATANTE por fulano. O sistema é case sensitive, ou
                    seja, você deverá respeitar letras maiúsculas e minúsculas.
              required:
              - templates
            example:
              name_document: Nome do documento
              uuid_folder: '{{uuid_folder}}'
              templates:
                '{{template_id}}':
                  '{{variable_exemplo_nome}}': valor 1
                  '{{variable_exemplo_endereco}}': valor 2
                  '{{...}}': valor n
                OTgx:
                  RAZAO_SOCIAL: D4SIGN COMPANY
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
                required:
                - message
                - uuid
              example:
                message: success
                uuid: 9ce0abc7-d5ae-4765-bfec-e627b51179be
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  mensagem_pt:
                    type: string
                required:
                - message
                - mensagem_pt
              example:
                message: You do not have permission on that safe
                mensagem_pt: Você não tem permissão de acesso nesse cofre.
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/makedocumentbytemplateword:
    post:
      summary: Make document by Template WORD
      deprecated: false
      description: "Esse objeto irá gerar um documento em seu cofre a partir de um template word.\n\n\n:::highlight orange 📌\nPara criar o documento em um cofre, é importante revisar a opção **Compartilhar** nas **Opções do template** em um template Word, será preciso ter as permissões de acesso \"Administrador\" ou \"Padrão\".\n:::\n\n\n# Caso Documento a partir do template WORD com mais de 1 preenchedor\n\n```json\n{\n    \"name_document\": \"Nome do documento\",\n    \"uuid_folder (opcional)\": \"{UUID DA PASTA}\",\n  \n    \"templates\": {\n       \"id_template\": {\n         \n        \"persona 1\":{\n\t    \t\t\t\"variavel 1\": \"valor 1\",\n\t    \t\t\t\"variavel 2\": \"valor 2\",\n\t    \t{...},\n        \n        \"persona 2\":{\n\t    \t\t\t\"variavel 1\": \"valor 1\",\n\t    \t\t\t\"variavel 2\": \"valor 2\",\n\t    \t{...},\n         \n         \"tokens_gerais\":{\n\t    \t\t\t\"variavel 1\": \"valor 1\",\n\t    \t\t\t\"variavel 2\": \"valor 2\",\n\t    \t{...}\n        \n\t    }\n   }\n}\n```\nExemplo\n```json\n\n{\n   \"name_document\":\"Modelo template para contrato com 2 preenchedores API\",\n   \"templates\":\n      {\n         \"MTIwMDcy=\":{\n            \"organizador\": {\n               \"nome_completo\":\"VALOR TESTE\",\n                \"nome\":\"VALOR TESTE\",\n                \"endereco_organizador\":\"VALOR TESTE\",\n                \"valor_total\":\"VALOR TESTE\",\n                \"nome_da_empresa\":\"VALOR TESTE\",\n                \"nome_do_representante_da_empresa\":\"VALOR TESTE\",\n                \"endereco_da_empresa\":\"VALOR TESTE\",\n                \"telefone_da_empresa\":\"VALOR TESTE 2\",\n                \"cargo_do_representante_da_empresa\":\"VALOR TESTE\",\n                \"e_mail_do_organizador_do_evento\":\"VALOR TESTE\"\n            },\n            \"cliente\": {\n                \"nome_completo\":\"VALOR TESTE 1\",\n                \"nome\":\"VALOR TESTE 1\",\n                \"endereco_cliente\":\"VALOR TESTE 1\",\n                \"endereco_do_cliente\":\"VALOR TESTE 1\",\n                \"telefone_do_cliente\":\"VALOR TESTE 1\",\n                \"e_mail_do_cliente\":\"VALOR TESTE 1\",\n                \"numero_de_cpf_ou_cnpj_do_cliente\":\"VALOR TESTE 1\"\n            },\n            \"tokens_gerais\": {\n                \"endereco\":\"VALOR Tokens Gerais\",\n                \"nome_completo\":\"VALOR Tokens Gerais\",\n                \"nome_do_evento\":\"VALOR Tokens Gerais\",\n                \"data_assinatura\":\"VALOR Tokens Gerais\",\n                \"nome_evento\":\"VALOR Tokens Gerais\",\n                \"data_evento\":\"VALOR Tokens Gerais\",\n                \"hora_inicio_evento\":\"VALOR Tokens Gerais\",\n                \"hora_termino_evento\":\"VALOR Tokens Gerais\",\n                \"local_evento\":\"VALOR Tokens Gerais\",\n                \"descricao\":\"VALOR Tokens Gerais\",\n                \"estado\":\"VALOR Tokens Gerais\",\n                \"local_e_data_da_assinatura\":\"VALOR Tokens Gerais\"\n            }\n        }\n      }\n}\n```"
      operationId: documentsTemplatePostWord
      tags:
      - Documents Templates
      - Templates
      - Documents
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name_document:
                  type: string
                  description: >-
                    (opcional) Define o nome do documento. Se não for
                    preenchido, o documento terá o nome "Documento"
                uuid_folder:
                  type: string
                  description: >-
                    (opcional) Para que o documento fique armazenado dentro da
                    pasta, informe o UUID dela.
                templates:
                  type: object
                  properties:
                    id_template 1:
                      type: object
                      properties:
                        variavel 1:
                          type: string
                        variavel 2:
                          type: string
                        '{{...}}':
                          type: string
                      required:
                      - variavel 1
                      - variavel 2
                      - '{{...}}'
                      description: >-
                        Array contendo o ID do template na CHAVE e as variáveis
                        no VALUE.
                  required:
                  - id_template 1
                  description: >-
                    Lembrando que você deverá informar pelo menos um template.
                    As variáveis dos campos personalizados (ex.: arrastando,
                    bloco, NOME_CONTRATANTE, etc.) precisam ser informadas
                    exatamente iguais ao cadastro. Ex.: 'NOME_CONTRATANTE' =>
                    'fulano' irá substituir o campo personalizado
                    NOME_CONTRATANTE por fulano. O sistema é case sensitive, ou
                    seja, você deverá respeitar letras maiúsculas e minúsculas.
              required:
              - name_document
              - uuid_folder
              - templates
            examples:
              '1':
                value: "{\n\t\"templates\":\"{\n\t\t\\\"ID_TEMPLATE1\\\": {\n\t\t\t\\\"CAMPO_PERSONALIZADO1\\\":\\\"TESTE1\\\",\n\t\t\t\\\"CAMPO_PERSONALIZADO2\\\":\\\"TESTE2\\\"\n\t\t},\n\t\t\\\"ID_TEMPLATE2\\\":{\n\t\t\t\\\"CAMPO_PERSONALIZADO1\\\":\\\"Teste1\\\",\n\t\t\t\\\"CAMPO_PERSONALIZADO2\\\":\\\"Teste2\\\"\n\t\t}\n\t}\"\n}"
              '2':
                value:
                  name_document: Nome do documento
                  uuid_folder: '{{uuid_folder}}'
                  templates:
                    id_template 1:
                      variavel 1: valor 1
                      variavel 2: valor 2
                      '{{...}}': valor n
                    OTgx:
                      RAZAO_SOCIAL: D4SIGN COMPANY
                summary: Example
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
                required:
                - message
                - uuid
              example:
                message: success
                uuid: fcd4f46b-9b85-4a2a-b434-b80ac1f11fbc
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/createrubricintemplateword:
    post:
      summary: Create Rubric Template Word
      deprecated: false
      description: |
        Gera um documento a partir de um template Word com rubricas posicionadas por token, no cofre informado.

        Fluxo: liste os templates (`POST /templates`) para obter o `id`, liste os cofres (`GET /safes`) para obter o `uuid_safe`, e então use este endpoint informando `templates.{id}.{token}` = e-mail do signatário correspondente a cada rubrica.
      operationId: documentsTemplateWordRubric
      tags:
      - Documents Templates
      parameters:
      - name: uuid_safe
        in: path
        description: ''
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/upload:
    post:
      summary: Upload File Principal Form-Data
      deprecated: false
      description: >
        Esse objeto realizará o UPLOAD do seu documento para os servidores da
        D4Sign.


        :::warning[]

        Após o UPLOAD, o documento será criptografado em nossos cofres e
        carimbado com um número de série.

        :::


        Após o processamento um preview será gerado. O processamento será
        realizado em background, ou seja, a requisição não ficará bloqueada.


        Todos os documentos ficam armazenados em COFRES criptografados, ou seja,
        o parâmetro `uuid_safe` é obrigatório e determina em qual cofre o
        documento ficará armazenado.


        :::highlight blue 📌

        ℹ️ Header `tokenAPI` não está documentado em explicar se não é
        necessário enviar pelos Parâmetros da Requisição (Query Parameters). A
        recomenda

        cão é enviar em ambos.

        :::
      operationId: documentsUploadFile
      tags:
      - Documents Upload/Download/Principal
      - Documents
      - Documents Upload
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      - name: tokenAPI
        in: header
        description: ''
        required: true
        example: '{{tokenAPI}}'
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: >-
                    Arquivo que será enviado para os servidores da D4Sign. MIME
                    Types aceitos PDF,DOC,DOCX,JPG,PNG,BMP
                  type: string
                  format: binary
                uuid_folder:
                  description: (Opcional) Identificador da pasta ou sub pasta.
                  example: '{{uuid_folder}}'
                  type: string
                workflow:
                  type: string
                  enum:
                  - '1'
                  - '2'
                  examples:
                  - '1'
                  - '2'
                  description: >-
                    1= Seguir a ordem de assinatura do parâmetro
                    "after_position" na requisição de cadastrar signatários.
                    \n2= Não seguir a ordem de assinatura do parâmetro
                    "after_position" na requisição de cadastrar signatários.
                  example: ''
              required:
              - file
            example:
              uuid_folder: '{{uuid_folder}}'
              workflow: ''
      responses:
