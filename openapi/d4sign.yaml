webhooks:
  documents_callback:
    post:
      summary: Documents Callback
      deprecated: false
      description: |2

        - In the Dashboard Panel, there is some configurations like:

          - Change the `Content-Type` between `form-data` or `json`.

          - Set Secret Key for HMAC validation of the messages that was received.
      operationId: documents_callback
      tags:
      - Webhooks
      - Documents
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Documents_Webhook_Callback_Request_Body'
            examples:
              finishedDocument:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '1'
                  message: Finished document
                  email:
                summary: Ex Type 1 Finished Document
              cancelledDocument:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '3'
                  message: Cancelled document
                summary: Ex Type 3 Cancelled Document
              emailNotSent:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '2'
                  message: E-mail not sent
                  email: email@signatario.com.br
                summary: Ex Type 2 Email Not Sent/Delivered
              signed:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '4'
                  message: Signed
                  email: email@signatario.com.br
                summary: Ex Type 4 Signature by Signatory on the Document
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type:
                - string
                - integer
                - boolean
                - array
                - object
                - number
                - 'null'
          headers: {}
      security:
      - Webhook_Basic_Auth: []
components:
  schemas:
    Documents_Webhook_Callback_Request_Body:
      type: object
      properties:
        uuid:
          type: string
          description: UUID Documento
          format: uuid
        type_post:
          type: string
          title: Type POST
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          examples:
          - '1'
          - '2'
          - '3'
          - '4'
        message:
          type: string
          examples:
          - Finished document
          - Cancelled document
          - E-mail not sent
          - Signed
        email:
          type:
          - string
          - 'null'
          description: Em alguns tipos de mensagem o e-mail não vem
          format: email
      required:
      - uuid
      - type_post
      - message
  responses:
    Not_Logged:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              mensagem_pt:
                type: string
            required:
            - message
            - mensagem_pt
          examples:
            Example 1:
              summary: Example 1
              value:
                message: 'API error: Check API user.'
                mensagem_pt: Chave de API inválida.
    Resource_Not_Found_Or_Unknown_Method:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
              error:
                type: string
            required:
            - status
            - error
          examples:
            Example 1:
              summary: Example 1
              value:
                status: false
                error: Método desconhecido
    Bad_Request:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
            required:
            - message
          examples:
            Example 1:
              summary: Example 1
              value:
                message: Safe not founded
            Example 2:
              summary: Example 2
              value:
                message: You do not have permission on that safe
            Example 3:
              summary: Example 3
              value:
                message: >-
                  You need to check your domain first. Go to
                  secure.d4sign.com.br and check your domain.
            Example 4:
              summary: Example 4
              value:
                message: >-
                  Invalid template ID: OTgx -
                  6a036f94-26d5-4aa6-89d8-4fddae6b309b
                mensagem_pt: ID do template inválido.
  securitySchemes:
    tokenAPI:
      type: apiKey
      in: query
      name: tokenAPI
    cryptKey:
      type: apiKey
      in: query
      name: cryptKey
    Webhook_Basic_Auth:
      type: http
      scheme: basic
