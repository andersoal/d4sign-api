  /api/v1/documents/{uuid_document}/downloadlist:
    post:
      summary: Download Documents and Certificate (Splited)
      deprecated: false
      description: |
        Gera uma URL para download em lote de documentos (principal e/ou anexos) e, opcionalmente, suas hashes (certificados de assinatura).

        | Parâmetro | Descrição |
        | --- | --- |
        | `language` (opcional) | `pt` ou `en`. |
        | `type` (opcional) | Omitir para PDF; `pdfa` para PDF/A. |
        | `documents` (obrigatório) | Mapa `{uuid-documento: "1"|"0"}` — `1` inclui a hash/certificado junto ao documento. |

        > O documento precisa estar finalizado (todos os signatários assinaram).
      operationId: documentsRelatedFilesDownload
      tags:
      - Documents Upload/Download
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: Identificador do Documento
        required: true
        example: '{{uuid_document}}'
        schema:
          type: string
      - name: tokenAPI
        in: header
        description: ''
        required: true
        example: '{{tokenAPI}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  description: >-
                    Para realizar o download do arquivo em inglês, escolha `en`
                    nesse atributo. Para realizar o download do arquivo em
                    português, escolha `pt` nesse atributo.
                type:
                  type: string
                  description: >-
                    Para fazer em download em pdf, exclua o atributo, mas para
                    baixar no formato pdf-a, escolha "pdfa" nesse atributo.
                documents:
                  type: object
                  properties:
                    uuid-slave-document1:
                      type: string
                      description: >-
                        Onde o uuid-slave-document é o uuid do arquivo que se
                        quer baixar (pode ser o doc principal ou anexo) e o
                        1-(true)/0-(false): se quer ou não baixar a hash
                        (certificado digital) junto ao documento.
                      enum:
                      - '0'
                      - '1'
                    uuid-slave-document2:
                      type: string
                      description: >-
                        Onde o uuid-slave-document é o uuid do arquivo que se
                        quer baixar (pode ser o doc principal ou anexo) e o
                        1-(true)/0-(false): se quer ou não baixar a hash
                        (certificado digital) junto ao documento.
                      enum:
                      - '0'
                      - '1'
                  description: Pode-se colocar mais UUID de arquivos, caso necessário.
              required:
              - documents
            example:
              language: pt
              type: pdf
              documents:
                uuid-slave-document1: '0'
                uuid-slave-document2: '0'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                - url
              example:
                url: https://secure.d4sign.com.br/CODIGO
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
