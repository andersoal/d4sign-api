  /api/v1/documents/{uuid_document}/generate-document-view:
    post:
      summary: Generate Temporary View URL for a Document
      deprecated: false
      description: |
        Generates a temporary URL (it expires after 5 minutes) to view the document, and optionally its attachments, without downloading it. This endpoint accepts only the main document's UUID, not an attachment's UUID.

        > This endpoint is documented in D4Sign's official v2.0 reference but was missing from the original export of this spec. See docapi.d4sign.com.br/v2.0/reference/document-and-attachment-viewer.
      operationId: documents_generate_view
      tags:
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: The main document's UUID. Attachments are not accepted here.
        required: true
        example: '{{uuid_document}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                with_attachments:
                  type: boolean
                  default: false
                  description: If true, the response also includes temporary URLs for the document's attachments.
            example:
              with_attachments: false
      responses:
        '200':
          description: URLs geradas; expiram em 5 minutos.
          content: {}
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
        '401':
          $ref: '#/components/responses/Not_Logged'
        '404':
          $ref: '#/components/responses/Resource_Not_Found_Or_Unknown_Method'
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/templates/upload:
    post:
      summary: Upload a Word Template
      deprecated: false
      description: |
        Creates a new template from a .doc or .docx file. This differs from `makedocumentbytemplateword`, which GENERATES a document from a template that already exists. This endpoint CREATES the template itself.

        > This endpoint is documented in D4Sign's official v2.0 reference but was missing from the original export of this spec. See docapi.d4sign.com.br/v2.0/reference/template-word-upload.
      operationId: templates_upload_word
      tags:
      - Templates
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: A .doc or .docx file.
                show_desk:
                  type: integer
                  default: 1
                  description: "`1` = visible in the platform's \"Templates Word\" section. `0` = hidden."
              required:
              - file
      responses:
        '201':
          description: Successful response. D4Sign created the template.
          content: {}
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
        '401':
          $ref: '#/components/responses/Not_Logged'
      security:
      - tokenAPI: []
        cryptKey: []
webhooks:
  documents_callback:
    post:
      summary: Documents Callback
      deprecated: false
      description: |2

        - In the Dashboard Panel, there is some configurations like:

          - Change the `Content-Type` between `form-data` or `json`.

          - Set Secret Key for HMAC validation of the messages that was received.
      operationId: documents_callback
      tags:
      - Webhooks
      - Documents
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Documents_Webhook_Callback_Request_Body'
            examples:
              finishedDocument:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '1'
                  message: Finished document
                  email:
                summary: Ex Type 1 Finished Document
              cancelledDocument:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '3'
                  message: Cancelled document
                summary: Ex Type 3 Cancelled Document
              emailNotSent:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '2'
                  message: E-mail not sent
                  email: email@signatario.com.br
                summary: Ex Type 2 Email Not Sent/Delivered
              signed:
                value:
                  uuid: '{{uuid_document}}'
                  type_post: '4'
                  message: Signed
                  email: email@signatario.com.br
                summary: Ex Type 4 Signature by Signatory on the Document
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type:
                - string
                - integer
                - boolean
                - array
                - object
                - number
                - 'null'
          headers: {}
      security:
      - Webhook_Basic_Auth: []
components:
  schemas:
    Documents_Webhook_Callback_Request_Body:
      description: The body D4Sign sends to your webhook URL when a document's state changes.
      type: object
      properties:
        uuid:
          type: string
          description: The document's UUID.
          format: uuid
        type_post:
          type: string
          title: Type POST
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          examples:
          - '1'
          - '2'
          - '3'
          - '4'
        message:
          type: string
          examples:
          - Finished document
          - Cancelled document
          - E-mail not sent
          - Signed
        email:
          type:
          - string
          - 'null'
          description: Some message types don't include the email.
          format: email
      required:
      - uuid
      - type_post
      - message
  responses:
    Not_Logged:
      description: 'The `tokenAPI`/`cryptKey` pair is missing or invalid.'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              mensagem_pt:
                type: string
            required:
            - message
            - mensagem_pt
          examples:
            Example 1:
              summary: Example 1
              value:
                message: 'API error: Check API user.'
                mensagem_pt: Chave de API inválida.
    Resource_Not_Found_Or_Unknown_Method:
      description: 'The resource or method does not exist.'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
              error:
                type: string
            required:
            - status
            - error
          examples:
            Example 1:
              summary: Example 1
              value:
                status: false
                error: Método desconhecido
    Bad_Request:
      description: 'The request is invalid. The `message` field explains why.'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
            required:
            - message
          examples:
            Example 1:
              summary: Example 1
              value:
                message: Safe not founded
            Example 2:
              summary: Example 2
              value:
                message: You do not have permission on that safe
            Example 3:
              summary: Example 3
              value:
                message: >-
                  You need to check your domain first. Go to
                  secure.d4sign.com.br and check your domain.
            Example 4:
              summary: Example 4
              value:
                message: >-
                  Invalid template ID: OTgx -
                  6a036f94-26d5-4aa6-89d8-4fddae6b309b
                mensagem_pt: ID do template inválido.
  securitySchemes:
    tokenAPI:
      type: apiKey
      in: query
      name: tokenAPI
      description: Your account's API token.
    cryptKey:
      type: apiKey
      in: query
      name: cryptKey
      description: Your account's crypt key.
    Webhook_Basic_Auth:
      type: http
      scheme: basic
      description: HTTP Basic credentials D4Sign sends with webhook callbacks, set when you register the webhook.
servers:
- url: https://secure.d4sign.com.br
  description: Production
- url: https://sandbox.d4sign.com.br
  description: Development / Sandbox
security:
- tokenAPI: []
  cryptKey: []
