      - name: type
        in: query
        description: "Resource type: 'cofre' (safe) or 'documento' (document)."
        required: true
        example: documento
        schema:
          type: string
          enum:
          - cofre
          - documento
      - name: uuid
        in: query
        description: The safe's or document's UUID.
        required: true
        example: '{{uuid}}'
        schema:
          type: string
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    description: Echoes the `type` query parameter.
                    type: string
                  uuid:
                    description: Echoes the `uuid` query parameter.
                    type: string
                  webhook_url:
                    type: string
                  history:
                    description: Delivery history for this webhook. Item shape unconfirmed — empty in testing.
                    type: array
                    items: {}
                required:
                - type
                - uuid
                - webhook_url
                - history
              examples:
                '1':
                  summary: Success, no delivery history yet
                  value:
                    type: documento
                    uuid: '{{uuid}}'
                    webhook_url: https://example.com/webhooks/d4sign
                    history: []
