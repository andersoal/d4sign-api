      summary: Register Webhook on Document
      deprecated: false
      description: |
        Registers a webhook URL (POSTBack) on the document. D4Sign sends a `POST` request, as form data, to that URL on these events:

        - the document is signed
        - the document is finished
        - the document is cancelled
        - an email fails to reach a signer

        > D4Sign retries delivery up to 7 times if the URL is unavailable (after 0 min, 1h, 1h, 1h, 6h, 6h, 12h). A webhook is lost only if the URL stays unavailable for more than 27 hours. See the guide for webhook security (HMAC).
      operationId: documents_webhooks_add
      tags:
