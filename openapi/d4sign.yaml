  /api/v1/documents/{uuid_safe}/makedocumentbytemplate:
    post:
      summary: Make document by Template HTML
      deprecated: false
      description: >+
        Generates a document in your safe from an HTML template.


        :::highlight orange 📌

        Note: to create the document in a safe, check the **Share** option in the HTML template's **Template Options**. This requires "Administrator" or "Standard" access permission.

        :::


        | Key | Description |

        | --- | --- |

        | name_document | (Optional) Sets the document's name. If you leave this blank, the document is named "Documento". |

        | uuid_folder | (Optional) To store the document inside a folder, set this to the folder's UUID. If you leave this blank, the document is saved directly in the safe set in the request. |

        | templates | (Required) The template ID as the KEY `id_template`, with the template's variables as KEY/VALUE pairs. |

      operationId: documents_template_html_create
      tags:
      - Documents Templates
      - Templates
      - Documents
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'The request body''s media type. Use `application/json`.'
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: 'The response media type you accept. Use `application/json`.'
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name_document:
                  type: string
                  description: >-
                    (Optional) Sets the document's name. If you leave this blank, the document is named "Documento".
                uuid_folder:
                  type: string
                  description: >-
                    (Optional) To store the document inside a folder, set this to the folder's UUID.
                templates:
                  type: object
                  properties:
                    '{{template_id}}':
                      type: object
                      properties:
                        '{{variable_nome}}':
                          type: string
                        '{{variable_endereco}}':
                          type: string
                        '{{variable_anything}}':
                          type: string
                      required:
                      - '{{variable_nome}}'
                      - '{{variable_endereco}}'
                      - '{{variable_anything}}'
                      description: >-
                        Array contendo o ID do template na CHAVE e as variáveis
                        no VALUE.
                  required:
                  - '{{template_id}}'
                  description: >-
                    You must set at least one template. The names of the custom fields (for example, NOME_CONTRATANTE) must match the template's registered field names exactly. For example, 'NOME_CONTRATANTE' => 'John Smith' replaces the custom field NOME_CONTRATANTE with John Smith. Field names are case-sensitive, so match the upper and lower case letters exactly.
              required:
              - templates
            example:
              name_document: Nome do documento
              uuid_folder: '{{uuid_folder}}'
              templates:
                '{{template_id}}':
                  '{{variable_exemplo_nome}}': valor 1
                  '{{variable_exemplo_endereco}}': valor 2
                  '{{...}}': valor n
                OTgx:
                  RAZAO_SOCIAL: D4SIGN COMPANY
        required: true
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
                required:
                - message
                - uuid
              example:
                message: success
                uuid: 9ce0abc7-d5ae-4765-bfec-e627b51179be
          headers: {}
        '400':
          description: 'Error response. The `message` field explains why the request failed.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  mensagem_pt:
                    type: string
                required:
                - message
                - mensagem_pt
              example:
                message: You do not have permission on that safe
                mensagem_pt: Você não tem permissão de acesso nesse cofre.
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/makedocumentbytemplateword:
    post:
      summary: Make document by Template WORD
      deprecated: false
      description: "Generates a document in your safe from a Word template.\n\n:::highlight orange 📌\nTo create the document in a safe, check the **Share** option in the Word template's **Template Options**. This requires \"Administrator\" or \"Standard\" access permission.\n:::\n\n# Case: a document from a WORD template with more than 1 form-filler\n\n```json\n{\n    \"name_document\": \"Document name\",\n    \"uuid_folder (optional)\": \"{FOLDER UUID}\",\n  \n    \"templates\": {\n       \"id_template\": {\n         \n        \"person 1\":{\n\t    \t\t\t\"variable 1\": \"value 1\",\n\t    \t\t\t\"variable 2\": \"value 2\",\n\t    \t{...},\n        \n        \"person 2\":{\n\t    \t\t\t\"variable 1\": \"value 1\",\n\t    \t\t\t\"variable 2\": \"value 2\",\n\t    \t{...},\n         \n         \"general_tokens\":{\n\t    \t\t\t\"variable 1\": \"value 1\",\n\t    \t\t\t\"variable 2\": \"value 2\",\n\t    \t{...}\n        \n\t    }\n   }\n}\n```\nExample\n```json\n\n{\n   \"name_document\":\"Contract template for 2 form-fillers API\",\n   \"templates\":\n      {\n         \"MTIwMDcy=\":{\n            \"organizer\": {\n               \"full_name\":\"TEST VALUE\",\n                \"name\":\"TEST VALUE\",\n                \"organizer_address\":\"TEST VALUE\",\n                \"total_value\":\"TEST VALUE\",\n                \"company_name\":\"TEST VALUE\",\n                \"company_representative_name\":\"TEST VALUE\",\n                \"company_address\":\"TEST VALUE\",\n                \"company_phone\":\"TEST VALUE 2\",\n                \"company_representative_title\":\"TEST VALUE\",\n                \"event_organizer_email\":\"TEST VALUE\"\n            },\n            \"client\": {\n                \"full_name\":\"TEST VALUE 1\",\n                \"name\":\"TEST VALUE 1\",\n                \"client_address\":\"TEST VALUE 1\",\n                \"client_address_2\":\"TEST VALUE 1\",\n                \"client_phone\":\"TEST VALUE 1\",\n                \"client_email\":\"TEST VALUE 1\",\n                \"client_cpf_or_cnpj\":\"TEST VALUE 1\"\n            },\n            \"general_tokens\": {\n                \"address\":\"General Tokens VALUE\",\n                \"full_name\":\"General Tokens VALUE\",\n                \"event_name\":\"General Tokens VALUE\",\n                \"signature_date\":\"General Tokens VALUE\",\n                \"event_name_2\":\"General Tokens VALUE\",\n                \"event_date\":\"General Tokens VALUE\",\n                \"event_start_time\":\"General Tokens VALUE\",\n                \"event_end_time\":\"General Tokens VALUE\",\n                \"event_location\":\"General Tokens VALUE\",\n                \"description\":\"General Tokens VALUE\",\n                \"state\":\"General Tokens VALUE\",\n                \"signature_place_and_date\":\"General Tokens VALUE\"\n            }\n        }\n      }\n}\n```"
      operationId: documents_template_word_create
      tags:
      - Documents Templates
      - Templates
      - Documents
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'The request body''s media type. Use `application/json`.'
        required: true
        example: application/json
        schema:
          type: string
      - name: Accept
        in: header
        description: 'The response media type you accept. Use `application/json`.'
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name_document:
                  type: string
                  description: >-
                    (Optional) Sets the document's name. If you leave this blank, the document is named "Documento".
                uuid_folder:
                  type: string
                  description: >-
                    (Optional) To store the document inside a folder, set this to the folder's UUID.
                templates:
                  type: object
                  properties:
                    id_template 1:
                      type: object
                      properties:
                        variavel 1:
                          type: string
                        variavel 2:
                          type: string
                        '{{...}}':
                          type: string
                      required:
                      - variavel 1
                      - variavel 2
                      - '{{...}}'
                      description: >-
                        Array contendo o ID do template na CHAVE e as variáveis
                        no VALUE.
                  required:
                  - id_template 1
                  description: >-
                    You must set at least one template. The names of the custom fields (for example, NOME_CONTRATANTE) must match the template's registered field names exactly. For example, 'NOME_CONTRATANTE' => 'John Smith' replaces the custom field NOME_CONTRATANTE with John Smith. Field names are case-sensitive, so match the upper and lower case letters exactly.
              required:
              - name_document
              - uuid_folder
              - templates
            examples:
              '1':
                value: "{\n\t\"templates\":\"{\n\t\t\\\"ID_TEMPLATE1\\\": {\n\t\t\t\\\"CAMPO_PERSONALIZADO1\\\":\\\"TESTE1\\\",\n\t\t\t\\\"CAMPO_PERSONALIZADO2\\\":\\\"TESTE2\\\"\n\t\t},\n\t\t\\\"ID_TEMPLATE2\\\":{\n\t\t\t\\\"CAMPO_PERSONALIZADO1\\\":\\\"Teste1\\\",\n\t\t\t\\\"CAMPO_PERSONALIZADO2\\\":\\\"Teste2\\\"\n\t\t}\n\t}\"\n}"
              '2':
                value:
                  name_document: Nome do documento
                  uuid_folder: '{{uuid_folder}}'
                  templates:
                    id_template 1:
                      variavel 1: valor 1
                      variavel 2: valor 2
                      '{{...}}': valor n
                    OTgx:
                      RAZAO_SOCIAL: D4SIGN COMPANY
                summary: Example
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
                required:
                - message
                - uuid
              example:
                message: success
                uuid: fcd4f46b-9b85-4a2a-b434-b80ac1f11fbc
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/createrubricintemplateword:
