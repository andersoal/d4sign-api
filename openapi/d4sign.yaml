      - tokenAPI: []
        cryptKey: []
  /api/v1/tags/{uuid_document}/add:
    post:
      summary: Add Tags to Document
      deprecated: false
      description: >-
        Adds a tag to your document.


        :::tip[]

        D4Sign stores a document's tags as one string.

        Each request adds one tag, which D4Sign appends to the tags already registered, separated by `, ` (a comma and a space).


        You can include more than one tag in a single request.


        Example:

        Request A

        ```json

        { "tag": "erp-financeiro:123" }

        ```

        Response

        ```json

        { "TAGs": "erp-financeiro:123" }

        ```


        Request B

        ```json

        { "tag": "crm:789,correlationId:a1b2c3-b1c2a3" }

        ```

        Response

        ```json

        { "TAGs": "erp-financeiro:123, crm:789,correlationId:a1b2c3-b1c2a3" }

        ```


        If you send a tag with a comma and no following space, D4Sign normalizes it. For example:


        The request's immediate response:


        `erp-financeiro:123, crm:789,correlationId:a1b2c3-b1c2a3`


        A few seconds later, this becomes:


        `erp-financeiro:123, crm:789, correlationId:a1b2c3-b1c2a3`


        After that, every tag is separated by a comma and a space.

        :::
      operationId: documents_tags_add
      tags:
      - Tags
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: The document's UUID.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'The request body''s media type. Use `application/json`.'
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  description: The tag to add to the document.
              required:
              - tag
            example:
              tag: erp-financeiro:123,crm:789,correlationId:a1b2c3-b1c2a3
        required: true
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  TAGs:
                    type: string
                required:
                - message
                - TAGs
              example:
                message: TAGs added sucessfully
                TAGs: erp-financeiro:123
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
