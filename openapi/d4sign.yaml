  /api/v1/documents/{uuid_document}/addsignaturetype:
    post:
      summary: Add Signature Type
      deprecated: false
      description: >+
        Registers a new "Act" number. Use this number when you add signers, to set a custom signature role label (the "Sign as" text).


        You can check a user's UUID at [Verify Users](https://docapi.d4sign.com.br/docs/usu%C3%A1rios).


        After you create a new Act number (for example, 347), link it to a signer with the Add Signatories endpoint (`POST /documents/{uuid_document}/createlist`).


        An Act number belongs to the platform, not to the account that created it. Any account that knows an existing Act number may use it.


        You can register a new Act with a label that already exists (a duplicate name). Each registration still creates a new, distinct Act number.


        When a new Act shares a label with an existing one, both work normally. There is no conflict.


        A registered Act must be available on the platform before you can use it.


        D4Sign's documentation lists 13 built-in Act numbers:


        | Code | Meaning |

        | -- | -- |

        | 1 | Sign |

        | 2 | Approve |

        | 3 | Acknowledge |

        | 4 | Sign as a party |

        | 5 | Witness |

        | 6 | Sign as an intervening party |

        | 7 | Acknowledge receipt |

        | 8 | Sign as drawer, endorser, and guarantor (aval) |

        | 9 | Sign as drawer, endorser, guarantor (aval), and surety |

        | 10 | Sign as surety |

        | 11 | Sign as a party and surety |

        | 12 | Sign as a jointly liable party |

        | 13 | Sign as a party and jointly liable party |

        | 14 | Sign as custodian (fiel depositário) |

        | 15 | Sign as guarantor (aval) |

        | 16 | Sign as a consenting party |

        | 17 | Sign as a guaranteeing intervening party |

        | 18 | Sign as a party and guarantor (aval) |

        | 19 | Sign as a party, guarantor (aval), and guaranteeing intervening party |

        | 20 | Sign as a party and surety |

        | 21 | Sign as a party, guarantor (aval), guaranteeing intervening party, and custodian |

        | 22 | Sign as a party and custodian |

        | 23 | Sign as a party and guaranteeing intervening party |

        | 24 | Sign as the fiduciary grantor (fiduciante) |

        | 25 | Sign as a party and fiduciary grantor (fiduciante) |

      operationId: documents_signature_type_add
      tags:
      - Signatories
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: The document's UUID.
        required: true
        example: '{{uuid_document}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo:
                  type: string
                  description: The name or title to add to the "Sign as" label.
              required:
              - tipo
            example:
              tipo: Testemunha Teste
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  act:
                    type: integer
                  signature_type:
                    type: string
                  success:
                    type: integer
                required:
                - act
                - signature_type
                - success
              example:
                act: 122424
                signature_type: Testemunha Teste
                success: 1
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
