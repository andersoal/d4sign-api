  /api/v1/tags/{uuid_document}/add:
    post:
      summary: Add Tags to Document
      deprecated: false
      description: >-
        Este método irá adicionar uma TAG em seu documento


        :::tip[]

        Considerando que o registro é uma String.

        A cada request é adicionado uma tag que é concatenada com as demais já
        registradas com separador `, ` (virgula + espaço em branco).


        Sendo assim, seria possível incluir mais de uma tag em uma única
        requisição.


        Exemplo:

        Requisição A

        ```json

        { "tag": "erp-financeiro:123" }

        ```

        Resposta 

        ```json

        { "TAGs": "erp-financeiro:123" }

        ```


        Requisição B

        ```json

        { "tag": "crm:789,correlationId:a1b2c3-b1c2a3" }

        ```

        Resposta 

        ```json

        { "TAGs": "erp-financeiro:123, crm:789,correlationId:a1b2c3-b1c2a3" }

        ```


        Deve se assumir que eventualmente o registro cadastrado com `,` sem
        separador de espaço é convertido, assim por exemplo:


        Na requisição imediatamente responde:


        `erp-financeiro:123, crm:789,correlationId:a1b2c3-b1c2a3`


        Após alguns segundos pelo que é observado se transforma em:


        `erp-financeiro:123, crm:789, correlationId:a1b2c3-b1c2a3`


        Onde todas tags tem a vírgula e o espaço como único separador

        :::
      operationId: documentsTagsAdd
      tags:
      - Tags
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: Identificador do Documento
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  description: Tag para ser adicionado no documento.
              required:
              - tag
            example:
              tag: erp-financeiro:123,crm:789,correlationId:a1b2c3-b1c2a3
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  TAGs:
                    type: string
                required:
                - message
                - TAGs
              example:
                message: TAGs added sucessfully
                TAGs: erp-financeiro:123
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
