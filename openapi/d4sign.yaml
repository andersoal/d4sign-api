    post:
      summary: Upload only hash file
      deprecated: false
      description: >-
        Esse recurso realizará o UPLOAD do hash de um documento para os
        servidores da D4Sign.


        Após o UPLOAD, o hash de documento será criptografado em nossos cofres e
        carimbado com um número de série.


        Todos os documentos ficam armazenados em COFRES criptografados, ou seja,
        o parâmetro UUID-SAFE é obrigatório e determina em qual cofre o hash de
        documento ficará armazenado.
      operationId: documentsUploadHash
      tags:
      - Documents Upload/Download
      - Documents
      - Documents Upload
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256:
                  type: string
                  description: >-
                    Informe o sha256 do arquivo em HEXADECIMAL. O sha256 deverá
                    possuir 64 caracteres. Atenção: Não envie o sha256 em
                    binário.
                  minLength: 64
                  maxLength: 64
                  pattern: ^[a-fA-F0-9]{64}$
                sha512:
                  type: string
                  description: >-
                    Informe o sha256 do arquivo em HEXADECIMAL. O sha512 deverá
                    possuir 64 caracteres. Atenção: Não envie o sha256 em
                    binário.
                  minLength: 64
                  maxLength: 64
                  pattern: ^[a-fA-F0-9]{64}$
                name:
                  type: string
                  description: (Opcional) Informe o nome do seu arquivo
                uuid_folder:
                  type: string
                  description: >-
                    (Opcional) Para que o documento fique armazenado dentro da
                    pasta, informe o UUID dela.
              required:
              - sha256
              - sha512
            example:
              sha256: 13f2a91a9e85d5240ff32754eba41c02...
              sha512: 9ddd2c2659ae6cd6790d1f31780c904145bd80272b51cb...
              name: Meu contrato de venda
              uuid_folder: '{UUID DA PASTA}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
              example:
                uuid: 9f08bf18-bf4b-410f-9701-c286e5b1cad1
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
