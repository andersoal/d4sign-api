      description: |
        Atualiza o e-mail (ou WhatsApp) de um signatário já cadastrado.

        | Parâmetro | Descrição |
        | --- | --- |
        | `email-before` (obrigatório) | E-mail/WhatsApp atual do signatário. |
        | `email-after` (obrigatório) | Novo e-mail/WhatsApp. |
        | `key-signer` | Chave do signatário (obtida ao listar signatários do documento). |
      operationId: documentsSignatoriesChangeEmail
      tags:
      - Signatories
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: ''
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email-before:
                  type: string
                  default: antigoemail@dominio.com
                  description: ANTIGO e-mail ou número de WhatsApp do signatário
                email-after:
                  type: string
                  default: novoemail@dominio.com
                  description: NOVO e-mail ou número de WhatsApp do signatário
                key-signer:
                  type: string
                  default: NyWx=
                  description: Chave do signatário (anterior - before)
              required:
              - email-before
              - email-after
              - key-signer
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  mensagem_pt:
                    type: string
                required:
                - message
                - mensagem_pt
              example:
                message: E-mail changed
                mensagem_pt: E-mail alterado.
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
