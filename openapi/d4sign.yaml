  /api/v1/documents/{uuid_document}/download:
    post:
      summary: Document download
      deprecated: false
      description: |
        Gera uma URL final para download do documento.

        | Parâmetro | Descrição |
        | --- | --- |
        | `type` (opcional) | `zip` para o arquivo completo, `pdf` para apenas o PDF, `pdfa` para PDF/A. |
        | `language` (opcional) | `pt` ou `en`. |
        | `document` (opcional) | `true` inclui no retorno, em base64, as fotos do documento de identidade/selfie usadas na autenticação (quando aplicável). |
        | `encoding` (opcional) | `1` retorna a URL do arquivo em base64. |

        > A URL retornada pode conter `&` — trate-a (coloque entre aspas) antes de usar em shells como o PowerShell.
      operationId: documentsDownloadFile
      tags:
      - Documents Upload/Download/Principal
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: Identificador do Documento
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: >-
          Para realizar o download do arquivo completo, escolha `ZIP` nesse
          atributo. Para realizar o download apenas do PDF, escolha `PDF`
          nesse atributo. Para fazer download em formato PDF/A, escolha `pdfa`
          neste atributo.
        required: false
        schema:
          type: string
          enum:
          - ZIP
          - PDF
          - PDF/A
      - name: language
        in: query
        description: >-
          Para realizar o download do arquivo em inglês, escolha `en` nesse
          atributo. Para realizar o download do arquivo em português, escolha
          `pt` nesse atributo.
        required: false
        schema:
          type: string
          enum:
          - pt
          - en
      - name: document
        in: query
        description: >-
          `true` : Traz na resposta as fotos do documento do signatário em
          base 64 caso tenho sido usada a autenticação documento com foto ou
          foto e selfie. Trazendo assim 3 arquivos: a frente do documento, o
          verso do documento e a foto selfie, caso tenho sido solicitada na
          autenticação.


          `false` : não traz na resposta as fotos do documento do signatário
          em base 64.
        required: false
        schema:
          type: boolean
      - name: encoding
        in: query
        description: 0 (false) download em pdf - 1 (true) download base 64
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  example: zip
                  type: string
              required:
              - type
            example:
              type: zip
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
