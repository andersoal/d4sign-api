      - Documents
      - Documents Upload
      parameters:
      - name: uuid_safe
        in: path
        description: ID do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base64_binary_file:
                  type: string
                  description: >-
                    Arquivo que será enviado para os servidores da D4Sign.
                    ATENÇÃO: Você deve enviar o binário do seu arquivo
                    codificado em BASE64
                  enum:
                  - application/pdf
                  - application/msword
                  - >-
                    application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  - image/jpeg
                  - image/png
                  - image/bmp
                mime_type:
                  type: string
                  description: Informe o MIMETYPE do seu arquivo
                name:
                  type: string
                  description: (Opcional) Informe o nome do seu arquivo
                uuid_folder:
                  type: string
                  description: >-
                    (Opcional) Para que o documento fique armazenado dentro da
                    pasta, informe o UUID dela.
              required:
              - base64_binary_file
              - mime_type
            example:
              base64_binary_file: JVhsdCAdwesAD2dsadfASDQW...
              mime_type: application/pdf
              name: Meu contrato de venda
              uuid_folder: '{{uuid_folder}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
                required:
                - message
                - uuid
              example:
                message: success
                uuid: 31710ecb-acce-4535-9d31-807e9ec66c74
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
