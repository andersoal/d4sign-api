  /api/v1/documents/{uuid_document}/scheduling:
    post:
      summary: Schedule document to signature
      deprecated: false
      description: |
        Agenda o envio do documento para assinatura em uma data/hora futura.

        | Parâmetro | Descrição |
        | --- | --- |
        | `message` (opcional) | Mensagem enviada aos signatários no envio. |
        | `workflow` (obrigatório) | `1` = não seguir a ordem de assinatura; `2` = seguir a ordem. |
        | `scheduling_date` (obrigatório) | Data (>= hoje), formato `aaaa/mm/dd`. |
        | `scheduling_time` (obrigatório) | Hora cheia entre 06:00 e 22:00 (ex.: `11:00`); se a data for hoje, deve ser maior que a hora atual. |
        | `urgent_document` (opcional) | `1` = documento urgente. |
      operationId: documentsSendToSignerScheduled
      tags:
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: Identificador do Documento
        required: true
        example: '{{uuid_document}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                workflow:
                  type: string
                scheduling_date:
                  type: string
                scheduling_time:
                  type: string
                urgent_document:
                  type: string
              required:
              - message
              - workflow
              - scheduling_date
              - scheduling_time
              - urgent_document
            example:
              message: Mensagem opcional de envio
              workflow: '1'
              scheduling_date: 2026/09/10
              scheduling_time: '21:00'
              urgent_document: '0'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
