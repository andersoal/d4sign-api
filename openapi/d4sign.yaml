  /api/v1/documents/{uuid_document}/download:
    post:
      summary: Document download
      deprecated: false
      description: |
        Generates the final URL to download the document.

        | Parameter | Description |
        | --- | --- |
        | `type` (optional) | `zip` for the complete file, `pdf` for the PDF only, `pdfa` for PDF/A. |
        | `language` (optional) | `pt` or `en`. |
        | `document` (optional) | `true` includes, base64-encoded, the ID document and selfie photos used for authentication, when the signer used that method. |
        | `encoding` (optional) | `1` returns the file URL base64-encoded. |

        > The returned URL can contain `&`. Quote it before you use it in a shell such as PowerShell.
      operationId: documents_download_file
      tags:
      - Documents Upload/Download/Principal
      - Documents
      parameters:
      - name: uuid_document
        in: path
        description: The document's UUID.
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: >-
          To download the complete file, set this to `ZIP`. To download only the PDF, set this to `PDF`. To download as PDF/A, set this to `pdfa`.
        required: false
        schema:
          type: string
          enum:
          - ZIP
          - PDF
          - PDF/A
      - name: language
        in: query
        description: >-
          To download the file in English, set this to `en`. To download it in Portuguese, set this to `pt`.
        required: false
        schema:
          type: string
          enum:
          - pt
          - en
      - name: document
        in: query
        description: >-
          `true`: the response includes the signer's ID-document photos, base64-encoded, when the signer used photo-ID or photo-ID-plus-selfie authentication. This returns up to 3 files: the front of the ID document, the back of the ID document, and the selfie photo, when the authentication method required it.


          `false`: the response does not include the signer's ID-document photos.
        required: false
        schema:
          type: boolean
      - name: encoding
        in: query
        description: '`0` (false) = download as PDF. `1` (true) = download base64-encoded.'
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  example: zip
                  type: string
              required:
              - type
            example:
              type: zip
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
