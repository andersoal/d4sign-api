  /api/v1/documents/{uuid_safe}/uploadhash:
    post:
      summary: Upload only hash file
      deprecated: false
      description: >-
        Uploads a document's hash to D4Sign's servers.


        After the upload, D4Sign encrypts the document hash in its safes and serial-stamps it.


        All documents are stored in encrypted SAFES. The `uuid_safe` parameter is required. It sets which safe stores the document hash.
      operationId: documents_upload_hash
      tags:
      - Documents Upload/Download
      - Documents
      - Documents Upload
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256:
                  type: string
                  description: >-
                    The file's SHA-256 hash, in hexadecimal. It must be 64 characters long. Attention: do not send the hash as binary data.
                  minLength: 64
                  maxLength: 64
                  pattern: ^[a-fA-F0-9]{64}$
                sha512:
                  type: string
                  description: >-
                    The file's SHA-512 hash, in hexadecimal. It must be 128 characters long. Attention: do not send the hash as binary data.
                  minLength: 64
                  maxLength: 64
                  pattern: ^[a-fA-F0-9]{64}$
                name:
                  type: string
                  description: (Optional) Your file's name.
                uuid_folder:
                  type: string
                  description: >-
                    (Optional) To store the document inside a folder, set this to the folder's UUID.
              required:
              - sha256
              - sha512
            example:
              sha256: 13f2a91a9e85d5240ff32754eba41c02...
              sha512: 9ddd2c2659ae6cd6790d1f31780c904145bd80272b51cb...
              name: Meu contrato de venda
              uuid_folder: '{UUID DA PASTA}'
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
              example:
                uuid: 9f08bf18-bf4b-410f-9701-c286e5b1cad1
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
