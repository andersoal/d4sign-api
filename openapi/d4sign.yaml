        description: 'The safe''s UUID.'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            examples: {}
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/upload:
    post:
      summary: Upload File Principal Form-Data
      deprecated: false
      description: >
        Uploads your document to D4Sign's servers.


        :::warning[]

        After the upload, D4Sign encrypts the document in its safes and serial-stamps it.

        :::


        After processing, D4Sign generates a preview. Processing runs in the background, so this request does not block.


        All documents are stored in encrypted SAFES. The `uuid_safe` parameter is required. It sets which safe stores the document.


        :::highlight blue 📌

        ℹ️ D4Sign's official docs do not state whether the `tokenAPI` header is required in addition to the query parameters. The recommendation is to send it in both places.

        :::
      operationId: documents_upload_file
      tags:
      - Documents Upload/Download/Principal
      - Documents
      - Documents Upload
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      - name: tokenAPI
        in: header
        description: 'Your account''s API token.'
        required: true
        example: '{{tokenAPI}}'
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: >-
                    The file to upload to D4Sign's servers. Accepted MIME types: PDF, DOC, DOCX, JPG, PNG, BMP.
                  type: string
                  format: binary
                uuid_folder:
                  description: (Optional) The folder's or subfolder's UUID.
                  example: '{{uuid_folder}}'
                  type: string
                workflow:
                  type: string
                  enum:
                  - '1'
                  - '2'
                  examples:
                  - '1'
                  - '2'
                  description: >-
                    `1` = follow the signing order set by the `after_position` parameter when you add signers. `2` = do not follow that order.
                  example: ''
              required:
              - file
            example:
              uuid_folder: '{{uuid_folder}}'
              workflow: ''
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
                required:
                - message
                - uuid
              example:
                message: success
                uuid: c19cb80c-1233-4a1b-802e-3e6f3ffebed5
          headers: {}
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/documents/{uuid_safe}/uploadbinary:
    post:
      summary: Upload File Principal Binary
      deprecated: false
      description: >+
        Uploads your document to D4Sign's servers.


        After the upload, D4Sign encrypts the document in its safes and serial-stamps it.


        After processing, D4Sign generates a preview. Processing runs in the background, so this request does not block.


        All documents are stored in encrypted SAFES. The `uuid_safe` parameter is required. It sets which safe stores the document.

      operationId: documents_upload_file_binary
      tags:
      - Documents Upload/Download/Principal
      - Documents
      - Documents Upload
      parameters:
      - name: uuid_safe
