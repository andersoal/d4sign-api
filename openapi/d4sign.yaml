openapi: 3.1.0
info:
  title: D4Sign v1.0.0
  description: |
    D4Sign is an electronic signature platform for documents. It meets the requirements of Provisional Measure 2.200-2/01 (authenticity, integrity, and non-repudiation), so signatures made through D4Sign carry full legal validity in Brazil.

    This is a RESTful API. All responses use JSON. Every request must send `tokenAPI` and `cryptKey` (`?tokenAPI={token}&cryptKey={cryptKey}`) — see the security scheme below. The default rate limit is **10 requests per hour** per account. To raise this limit, contact comercial@d4sign.com.br.

    Official Postman collection: https://documenter.getpostman.com/view/1486030/d4sign-api/2TnpL3 (it is configured to use the Sandbox host by default).
  version: 1.0.0
  summary: D4Sign Summary
  contact:
    name: D4Sign Support
    email: suporte@d4sign.com.br
    url: https://d4sign.com.br
  license:
    name: Proprietary
tags:
- name: Account
  description: Your D4Sign account settings.
- name: Certificates
  description: The digital certificate a signer must use.
- name: Documents
  description: Documents stored in a safe, and their status and metadata.
- name: Documents Templates
  description: Documents generated from a saved template.
- name: Documents Upload
  description: Uploading a document as a raw binary file.
- name: Documents Upload/Download
  description: Uploading documents to, and downloading documents from, a safe.
- name: Documents Upload/Download/Principal
  description: Uploading and downloading a document's main file.
- name: Documents Upload/Download/Secondary / Attachment
  description: Uploading and downloading a document's extra attachment files.
- name: Folders
  description: Folders that organize documents inside a safe.
- name: Folders by Safe
  description: Folders that belong to a specific safe.
- name: Safes
  description: A safe is a top-level folder that holds documents and sub-folders.
- name: Signatories
  description: The people who sign a document, and their signature links.
- name: Tags
  description: Labels you attach to a document to organize it.
- name: Templates
  description: Reusable document templates.
- name: Users
  description: Accounts that can sign in to D4Sign.
- name: Watchers
  description: People who get a copy of a document's notifications without signing it.
- name: Webhooks
  description: Callbacks that D4Sign sends your server when a document's state changes.
paths:
  /api/v1/safes:
    get:
      summary: List All Safes
      deprecated: false
      description: |
        Lists all safes in the account.

        > Remember to send `tokenAPI` and `cryptKey` with the request.
      operationId: safes_list
      tags:
      - Safes
      parameters: []
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid_safe:
                      type: string
                    name-safe:
                      type: string
                  required:
                  - uuid_safe
                  - name-safe
              example:
              - uuid_safe: 6a036f94-26d5-4aa6-89d8-4fddae6b309b
                name-safe: NDA - Sandbox
              - uuid_safe: 651d69fa-33fe-494c-8f5a-0042f737d816
                name-safe: 'NDA - Automação '
          headers: {}
        '401':
          $ref: '#/components/responses/Not_Logged'
        '404':
          $ref: '#/components/responses/Resource_Not_Found_Or_Unknown_Method'
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/folders/{uuid_safe}/find:
    get:
      summary: List All Folders
      deprecated: false
      description: |
        Lists all folders in the given safe.
      operationId: folders_list_by_safe
      tags:
      - Folders by Safe
      - Folders
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid_safe:
                      type: string
                    uuid_folder:
                      type: string
                    name:
                      type: string
                    dt_cadastro:
                      type: string
              example:
              - uuid_safe: 6a036f94-26d5-4aa6-89d8-4fddae6b309b
                uuid_folder: 487d4278-a8e6-4fd2-88ba-001a6906ad27
                name: NDA - Sandbox
                dt_cadastro: '2023-06-25 22:07:29'
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
        '401':
          $ref: '#/components/responses/Not_Logged'
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/folders/{uuid_safe}/create:
    post:
      summary: Create Folder or Subfolder on Safe
      deprecated: false
      description: |
        Creates a folder, or a subfolder, inside the given safe.

        | Parameter | Description |
        | --- | --- |
        | `uuid_folder` (optional) | The parent folder's UUID, to create a subfolder. |
        | `folder_name` (required) | The folder's or subfolder's name. |
      operationId: folders_create
      tags:
      - Folders by Safe
      - Folders
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_name:
                  type: string
                  description: The name of the folder or subfolder to create.
                uuid_folder:
                  type: string
                  description: >-
                    (Optional) The parent folder's UUID, to create a subfolder inside it.
              required:
              - folder_name
            example:
              uuid_folder: 487d4278-a8e6-4fd2-88ba-001a6906ad27
              folder_name: Novo Teste
        required: true
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    description: Identificador da Pasta ou Sub Pasta
                  message:
                    type: string
                    description: Mensagem
                required:
                - message
              example:
                message: Folder created
                uuid: 8def3be3-6e10-4462-872f-2b83b40d34df
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
        '401':
          $ref: '#/components/responses/Not_Logged'
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/folders/{uuid_safe}/rename:
    post:
      summary: Rename Folder
      deprecated: false
      description: |
        Renames a folder or subfolder inside the given safe.

        | Parameter | Description |
        | --- | --- |
        | `folder_name` (required) | The folder's or subfolder's new name. |
        | `uuid_folder` (required) | The UUID of the folder or subfolder to rename. |
      operationId: folders_rename
      tags:
      - Folders by Safe
      - Folders
      parameters:
      - name: uuid_safe
        in: path
        description: The safe's UUID.
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_name:
                  type: string
                  description: The folder's or subfolder's new name.
                uuid_folder:
                  type: string
                  description: The UUID of the folder or subfolder to rename.
              required:
              - folder_name
              - uuid_folder
            example:
              folder_name: Nome da pasta
              uuid_folder: ''
        required: true
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
              example:
                message: Folder changed
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
        '401':
          $ref: '#/components/responses/Not_Logged'
      security:
      - tokenAPI: []
        cryptKey: []
