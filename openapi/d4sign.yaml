ocument has been sent for signature,\n    \"doc_auth\": \"0\",\n    \"embed_methodauth\": \"email\",\n    \"embed_smsnumber\": \"\",\n    \"upload_allow\": \"0\",\n    \"upload_obs\": \"Articles of Incorporation and Utility Bill\",\n    \"docauthandselfie\": \"0\",\n    \"skipemail\": \"0\",\n    \"whatsapp\": \"\",\n    \"password_code\": \"\",\n    \"status\": \"created\"\n}\n    ```\n  </Column>\n</Columns>\n\n| Parameter | Description |\n| --- | --- |\n| email (required) | The signer's email |\n| act (required) | The signing action. Allowed values:   1 = Sign   2 = Approve   3 = Acknowledge   4 = Sign as a party   5 = Witness   6 = Sign as an intervening party   7 = Acknowledge receipt   8 = Sign as drawer, endorser, and guarantor (aval)   9 = Sign as drawer, endorser, guarantor (aval), and surety   10 = Sign as surety   11 = Sign as a party and surety   12 = Sign as a jointly liable party   13 = Sign as a party and jointly liable party |\n| foreign (required) | Whether the signer is a foreign national. 0 = has a CPF. 1 = does not have a CPF |\n| foreign\\_lang | The foreign signer's language: en = English, es = Spanish, pt = Portuguese |\n| certificadoicpbr (required) | 0 = standard D4Sign signature   1 = signature with an ICP-Brasil certificate |\n| assinatura\\_presencial (required) | 1 = in-person signature   0 = not in person |\n| docauth (optional) | 1 = requires a photo ID   0 = not required |\n| docauthandselfie (optional) | 1 = photo ID + selfie   0 = selfie not required |\n| embed\\_methodauth (optional) | Authentication method: email, password, sms, whats |\n| embed\\_smsnumber (optional) | The SMS or WhatsApp number, in standard format (for example, +5511953020202) |\n| upload\\_allow (optional) | Whether the signer can upload other documents |\n| upload\\_obs (optional) | Which documents the signer must upload (when upload\\_allow = 1) |\n| after\\_position (optional) | Sets the signing-order position after which this signer is inserted |\n| skipemail (optional) | 1 = do not send emails to this signer |\n| whatsapp\\_number (optional) | The WhatsApp
        number to use for signing |\n| uuid\\_grupo (optional) | The signing group's UUID |\n| certificadoicpbr\\_tipo (optional) | 1 = any certificate   2 = e-CPF   3 = e-CNPJ |\n| certificadoicpbr\\_cpf (optional) | The signer's CPF. Leave blank to accept any e-CPF |\n| certificadoicpbr\\_cnpj (optional) | The signer's CNPJ. Leave blank to accept any e-CNPJ |\n| password\\_code (optional) | The signer's access code. Leave blank to remove the previous code |\n| auth\\_pix (optional) | 1 = authenticate via PIX |\n| auth\\_pix\\_nome | Required if auth\\_pix = 1 |\n| auth\\_pix\\_cpf | Required if auth\\_pix = 1 |\n| sms-number (required) | The signer's NEW SMS number |\n| key-signer | The signer's key |\n| videoselfie | 1 = requires a video selfie |\n| d4sign\\_score (optional) | Turns on D4Sign Score. Requires a driver's license plus docauthandselfie = 1 or videoselfie = 1 |\n| d4sign\\_score\\_nome | Required if d4sign\\_score = 1 |\n| d4sign\\_score\\_cpf | Required if d4sign\\_score = 1 |\n| d4sign\\_score\\_similarity | The required similarity level (min: 70, max: 90) |\n  </Accordion>\n  <Accordion title=\"Case: Add Signer Groups to a Document\">\n\n| Parameter | Description |\n| --- | --- |\n| email (required) | The signer's email |\n| act (required) | The signing action. Allowed values:   1 = Sign   2 = Approve   3 = Acknowledge   4 = Sign as a party   5 = Witness   6 = Sign as an intervening party   7 = Acknowledge receipt   8 = Sign as drawer, endorser, and guarantor (aval)   9 = Sign as drawer, endorser, guarantor (aval), and surety   10 = Sign as surety   11 = Sign as a party and surety   12 = Sign as a jointly liable party   13 = Sign as a party and jointly liable party |\n| foreign (required) | Whether the signer is a foreign national. 0 = has a CPF. 1 = does not have a CPF |\n| foreign\\_lang | The foreign signer's language: en = English, es = Spanish, pt = Portuguese |\n| certificadoicpbr (required) | 0 = standard D4Sign signature   1 = signature with an ICP-Brasil certificate |\n| assinatura\\_presencial (required) | 1 = in-person signature   0 = not in person |\n| docauth (optional) | 1 = requires a photo ID   0 = not required |\n| docauthandselfie (optional) | 1 = photo ID + selfie   0 = selfie not required |\n| embed\\_methodauth (optional) | Authentication method: email, password, sms, whats |\n| embed\\_smsnumber (optional) | The SMS or WhatsApp number, in standard format (for example, +5511953020202) |\n| upload\\_allow (optional) | Whether the signer can upload other documents |\n| upload\\_obs (optional) | Which documents the signer must upload (when upload\\_allow = 1) |\n| after\\_position (optional) | Sets the signing-order position after which this signer is inserted |\n| skipemail (optional) | 1 = do not send emails to this signer |\n| whatsapp\\_number (optional) | The WhatsApp number to use for signing |\n| uuid\\_grupo (optional) | The signing group's UUID |\n| certificadoicpbr\\_tipo (optional) | 1 = any certificate   2 = e-CPF   3 = e-CNPJ |\n| certificadoicpbr\\_cpf (optional) | The signer's CPF. Leave blank to accept any e-CPF |\n| certificadoicpbr\\_cnpj (optional) | The signer's CNPJ. Leave blank to accept any e-CNPJ |\n| password\\_code (optional) | The signer's access code. Leave blank to remove the previous code |\n| auth\\_pix (optional) | 1 = authenticate via PIX |\n| auth\\_pix\\_nome | Required if auth\\_pix = 1 |\n| auth\\_pix\\_cpf | Required if auth\\_pix = 1 |\n| sms-number (required) | The signer's NEW SMS number |\n| key-signer | The signer's key |\n| videoselfie | 1 = requires a video selfie |\n| d4sign\\_score (optional) | Turns on D4Sign Score. Requires a driver's license plus docauthandselfie = 1 or videoselfie = 1 |\n| d4sign\\_score\\_nome | Required if d4sign\\_score = 1 |\n| d4sign\\_score\\_cpf | Required if d4sign\\_score = 1 |\n| d4sign\\_score\\_similarity | The required similarity level (min: 70, max: 90) |\n\nPer the table above, `act` sets the action this group performs in the signing process, such as signing or approving. `uuid_grupo` is the group's UUID.
        It must belong to the same safe as this document. You can look it up with the signing-groups endpoint documented elsewhere in this reference.\n      \n      \n  </Accordion>\n  <Accordion title=\"Case: Add Trust ID (Extra Verification)\">\n    https://docapi.d4sign.com.br/docs/endpoints-2#adicionar-trust-id-verifica%C3%A7%C3%A3o-extra\n  </Accordion>\n</AccordionGroup>\n\n\n"
      operationId: documents_signatories_create
      tags:
      - Signatories
      parameters:
