openapi: 3.1.0
info:
  title: D4Sign v1.0.0
  description: |
    A D4Sign é uma plataforma de assinatura eletrônica de documentos que atende os requisitos da Medida Provisória 2.200-2/01 (autenticidade, integridade e não repúdio), trazendo validade jurídica para as assinaturas realizadas através da D4Sign.

    API RESTful, respostas em JSON. Toda requisição deve enviar `tokenAPI` e `cryptKey` (`?tokenAPI={token}&cryptKey={cryptKey}`) — veja o esquema de segurança abaixo. Limite padrão: **10 requisições por hora** por conta; para aumentar, contato comercial@d4sign.com.br.

    Collection Postman oficial: https://documenter.getpostman.com/view/1486030/d4sign-api/2TnpL3 (host padrão configurado é o de Sandbox).
  version: 1.0.0
  summary: D4Sign Summary
tags:
- name: Safes
- name: Folders by Safe
- name: Documents Templates
- name: Documents Upload/Download
- name: Documents Upload/Download/Principal
- name: Documents Upload/Download/Secondary / Attachment
- name: Signatories
- name: Documents
- name: Webhooks
- name: Tags
- name: Watchers
- name: Certificates
- name: Users
- name: Folders
- name: Templates
- name: Documents Upload
- name: Account
paths:
  /api/v1/safes:
    get:
      summary: List All Safes
      deprecated: false
      description: |
        Lista TODOS os cofres da conta.

        > Não esqueça de enviar `tokenAPI` e `cryptKey` na requisição.
      operationId: safesList
      tags:
      - Safes
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid_safe:
                      type: string
                    name-safe:
                      type: string
                  required:
                  - uuid_safe
                  - name-safe
              example:
              - uuid_safe: 6a036f94-26d5-4aa6-89d8-4fddae6b309b
                name-safe: NDA - Sandbox
              - uuid_safe: 651d69fa-33fe-494c-8f5a-0042f737d816
                name-safe: 'NDA - Automação '
          headers: {}
        '401':
          $ref: '#/components/responses/Not_Logged'
          description: ''
        '404':
          $ref: '#/components/responses/Resource_Not_Found_Or_Unknown_Method'
          description: ''
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/folders/{uuid_safe}/find:
    get:
      summary: List All Folders
      deprecated: false
      description: |
        Lista TODAS as pastas do cofre informado.
      operationId: foldersFindBySafe
      tags:
      - Folders by Safe
      - Folders
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid_safe:
                      type: string
                    uuid_folder:
                      type: string
                    name:
                      type: string
                    dt_cadastro:
                      type: string
              example:
              - uuid_safe: 6a036f94-26d5-4aa6-89d8-4fddae6b309b
                uuid_folder: 487d4278-a8e6-4fd2-88ba-001a6906ad27
                name: NDA - Sandbox
                dt_cadastro: '2023-06-25 22:07:29'
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
          description: ''
        '401':
          $ref: '#/components/responses/Not_Logged'
          description: ''
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/folders/{uuid_safe}/create:
    post:
      summary: Create Folder or Subfolder on Safe
      deprecated: false
      description: |
        Cria uma pasta (ou subpasta) dentro do cofre informado.

        | Parâmetro | Descrição |
        | --- | --- |
        | `uuid_folder` (opcional) | UUID da pasta pai, para criar uma subpasta. |
        | `folder_name` (obrigatório) | Nome da pasta ou subpasta. |
      operationId: foldersCreate
      tags:
      - Folders by Safe
      - Folders
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_name:
                  type: string
                  description: Nome da pasta ou sub pasta que será criada
                uuid_folder:
                  type: string
                  description: >-
                    (Opcional) Identificador (hierarquia pai) da pasta ou sub
                    pasta onde quer criar o elemento novo.
              required:
              - folder_name
            example:
              uuid_folder: 487d4278-a8e6-4fd2-88ba-001a6906ad27
              folder_name: Novo Teste
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    description: Identificador da Pasta ou Sub Pasta
                  message:
                    type: string
                    description: Mensagem
                required:
                - message
              example:
                message: Folder created
                uuid: 8def3be3-6e10-4462-872f-2b83b40d34df
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
          description: ''
        '401':
          $ref: '#/components/responses/Not_Logged'
          description: ''
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/folders/{uuid_safe}/rename:
    post:
      summary: Rename Folder
      deprecated: false
      description: |
        Renomeia uma pasta ou subpasta dentro do cofre informado.

        | Parâmetro | Descrição |
        | --- | --- |
        | `folder_name` (obrigatório) | Novo nome da pasta ou subpasta. |
        | `uuid_folder` (obrigatório) | UUID da pasta ou subpasta a renomear. |
      operationId: foldersRename
      tags:
      - Folders by Safe
      - Folders
      parameters:
      - name: uuid_safe
        in: path
        description: Identificador do Cofre
        required: true
        example: '{{uuid_safe}}'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_name:
                  type: string
                  description: Novo Nome da Pasta ou Subpasta
                uuid_folder:
                  type: string
                  description: Identificador da pasta ou subpasta que será renomeada
              required:
              - folder_name
              - uuid_folder
            example:
              folder_name: Nome da pasta
              uuid_folder: ''
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
              example:
                message: Folder changed
          headers: {}
        '400':
          $ref: '#/components/responses/Bad_Request'
          description: ''
        '401':
          $ref: '#/components/responses/Not_Logged'
          description: ''
      security:
      - tokenAPI: []
        cryptKey: []
  /api/v1/templates/:
    post:
      summary: List Templates
      deprecated: false
      description: Esse objeto irá retornar todos os templates criados em sua conta.
      operationId: documentsTemplatesListAll
      tags:
      - Documents Templates
      - Documents
      - Templates
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  '1':
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                      variables:
                        type: object
                        properties:
                          tokens_gerais:
                            type: array
                            items:
                              type: string
                        required:
                        - tokens_gerais
                    required:
                    - id
                    - name
                    - type
                    - variables
                required:
                - '1'
              example:
                '1':
                  id: NzU4ODg=
                  name: HTML NDA Nenhum
                  type: html
                  variables:
                  - ''
                '2':
                  id: NzU4OTA=
                  name: HTML NDA
                  type: html
                  variables:
                  - NOME
                  - CNPJ
                  - telefone
                  - email
                  - ENDERECO
                  - email
                  - telefone
                '3':
                  id: MjAyODQz
                  name: Modelo template para contrato com 1 preenchedor.docx
